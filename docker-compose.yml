services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: electro
      POSTGRES_PASSWORD: electro
      POSTGRES_DB: electro_lab
    ports:
      - "5433:5432"
    volumes:
      - electro_lab_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electro -d electro_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - circuit-engine
      - learning-api

  web:
    build:
      context: ./apps/web
    expose:
      - "80"

  circuit-engine:
    build:
      context: .
      dockerfile: services/circuit-engine/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  learning-api:
    build:
      context: .
      dockerfile: services/learning-api/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__LearningDb: Host=db;Port=5432;Database=electro_lab;Username=electro;Password=electro
    depends_on:
      db:
        condition: service_healthy

volumes:
  electro_lab_pg:
