server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # Angular static output: `/` is client-rendered, so the plain client shell is `index.csr.html`
  # (only prerendered routes get an `index.html`). Serve it for the root and as the SPA fallback.
  index index.csr.html index.html;

  # Client shell and prerendered pages: always revalidate so a deploy is picked up immediately.
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Hashed bundles (main-XXXXXXXX.js, chunk-XXXXXXXX.js, styles-XXXXXXXX.css) are immutable.
  location ~* -[A-Za-z0-9]{8}\.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.csr.html;
  }
}
