<div class="toolbar">
  <div class="tool-modes" role="group" [attr.aria-label]="'lab.toolbar.tools' | t">
    <button
      type="button"
      class="mode"
      [class.active]="tool() === 'select'"
      (click)="toolChange.emit('select')"
    >
      <svg class="mode-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path
          d="M3 2.5 3 13.2 6.1 10.4 8.4 14.5 10 13.6 7.7 9.5 11.5 9.5Z"
          fill="currentColor"
        />
      </svg>
      <span>{{ 'lab.toolbar.select' | t }}</span>
    </button>
    <button
      type="button"
      class="mode"
      [class.active]="tool() === 'wire'"
      (click)="toolChange.emit('wire')"
    >
      <svg class="mode-icon" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="3.5" cy="8" r="1.6" fill="currentColor" />
        <circle cx="12.5" cy="8" r="1.6" fill="currentColor" />
        <path d="M5.2 8h5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </svg>
      <span>{{ 'lab.toolbar.wire' | t }}</span>
    </button>
    <button
      type="button"
      class="mode"
      [class.active]="tool() === 'probe'"
      (click)="toolChange.emit('probe')"
    >
      <svg class="mode-icon" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="7" cy="7" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M9.4 9.4 13 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
      <span>{{ 'lab.toolbar.probe' | t }}</span>
    </button>
  </div>
  <div class="tool-group">
    <button
      type="button"
      [class.active]="analysisMode() === 'dcOp'"
      (click)="analysisModeChange.emit('dcOp')"
    >
      {{ 'lab.toolbar.dc' | t }}
    </button>
    <button
      type="button"
      [class.active]="analysisMode() === 'tran'"
      (click)="analysisModeChange.emit('tran')"
    >
      {{ 'lab.toolbar.transient' | t }}
    </button>
    <button
      type="button"
      [class.active]="analysisMode() === 'ac'"
      (click)="analysisModeChange.emit('ac')"
    >
      {{ 'lab.toolbar.ac' | t }}
    </button>
    @if (analysisMode() === 'tran') {
      <label class="timebase">
        {{ 'lab.toolbar.tStop' | t }}
        <input
          type="number"
          [ngModel]="tStop()"
          (ngModelChange)="tStopChange.emit($event)"
          step="0.001"
          min="0.0001"
        />
      </label>
      <label class="timebase">
        {{ 'lab.toolbar.dt' | t }}
        <input
          type="number"
          [ngModel]="dt()"
          (ngModelChange)="dtChange.emit($event)"
          step="0.00001"
          min="0.000001"
        />
      </label>
      <label class="timebase init-from-dc">
        <input
          type="checkbox"
          [ngModel]="initFromDc()"
          (ngModelChange)="initFromDcChange.emit(!!$event)"
        />
        {{ 'lab.toolbar.initFromDc' | t }}
      </label>
    }
    @if (analysisMode() === 'ac') {
      <label class="timebase">
        {{ 'lab.toolbar.freq' | t }}
        <input
          type="number"
          [ngModel]="acFreq()"
          (ngModelChange)="acFreqChange.emit($event)"
          step="10"
          min="0.1"
        />
      </label>
    }
  </div>
  <div class="tool-group tool-group-end">
    <button type="button" (click)="undo.emit()" [disabled]="!canUndo()">
      {{ 'lab.toolbar.undo' | t }}
    </button>
    <button type="button" (click)="redo.emit()" [disabled]="!canRedo()">
      {{ 'lab.toolbar.redo' | t }}
    </button>
    <button type="button" (click)="duplicate.emit()" [disabled]="!canDuplicate()">
      {{ 'lab.toolbar.duplicate' | t }}
    </button>
    <button type="button" class="danger" (click)="remove.emit()" [disabled]="!canDelete()">
      {{ 'lab.toolbar.delete' | t }}
    </button>
    @if (!challengeMode()) {
    <label class="preset-select">
      <span class="sr-only">{{ 'lab.toolbar.presets' | t }}</span>
      <select [ngModel]="selectedPreset() ?? ''" (ngModelChange)="onPresetModelChange($event)">
        <option value="" disabled>{{ 'lab.toolbar.presets' | t }}</option>
        <option value="led">{{ 'lab.toolbar.ledPreset' | t }}</option>
        <option value="ledFade">{{ 'lab.toolbar.ledFadePreset' | t }}</option>
        <option value="rc">{{ 'lab.toolbar.rcPreset' | t }}</option>
        <option value="pot">{{ 'lab.toolbar.potPreset' | t }}</option>
        <option value="pulse">{{ 'lab.toolbar.pulsePreset' | t }}</option>
        <option value="opampFollower">{{ 'lab.toolbar.opampFollowerPreset' | t }}</option>
        <option value="opamp">{{ 'lab.toolbar.opampPreset' | t }}</option>
        <option value="opampNonInv">{{ 'lab.toolbar.opampNonInvPreset' | t }}</option>
        <option value="opampComparator">{{ 'lab.toolbar.opampComparatorPreset' | t }}</option>
        <option value="opampSchmitt">{{ 'lab.toolbar.opampSchmittPreset' | t }}</option>
        <option value="opampSumming">{{ 'lab.toolbar.opampSummingPreset' | t }}</option>
        <option value="opampIntegrator">{{ 'lab.toolbar.opampIntegratorPreset' | t }}</option>
        <option value="opampDifferentiator">{{ 'lab.toolbar.opampDifferentiatorPreset' | t }}</option>
        <option value="opampActiveFilter">{{ 'lab.toolbar.opampActiveFilterPreset' | t }}</option>
        <option value="ac">{{ 'lab.toolbar.acPreset' | t }}</option>
        <option value="bjt">{{ 'lab.toolbar.bjtPreset' | t }}</option>
        <option value="relay">{{ 'lab.toolbar.relayPreset' | t }}</option>
        <option value="nmos">{{ 'lab.toolbar.nmosPreset' | t }}</option>
        <option value="ne555">{{ 'lab.toolbar.ne555Preset' | t }}</option>
        <option value="ne555Pot">{{ 'lab.toolbar.ne555PotPreset' | t }}</option>
        <option value="christmasTree">{{ 'lab.toolbar.christmasTreePreset' | t }}</option>
        <option value="pushbutton">{{ 'lab.toolbar.pushbuttonPreset' | t }}</option>
        <option value="ldr">{{ 'lab.toolbar.ldrPreset' | t }}</option>
        <option value="buzzer">{{ 'lab.toolbar.buzzerPreset' | t }}</option>
        <option value="motor">{{ 'lab.toolbar.motorPreset' | t }}</option>
        <option value="arduino">{{ 'lab.toolbar.arduinoPreset' | t }}</option>
        <option value="i2cOled">{{ 'lab.toolbar.i2cOledPreset' | t }}</option>
        <option value="halfWave">{{ 'lab.toolbar.halfWavePreset' | t }}</option>
        <option value="bridge">{{ 'lab.toolbar.bridgePreset' | t }}</option>
        <option value="filterCap">{{ 'lab.toolbar.filterCapPreset' | t }}</option>
        <option value="zener">{{ 'lab.toolbar.zenerPreset' | t }}</option>
        <option value="vreg7805">{{ 'lab.toolbar.vreg7805Preset' | t }}</option>
        <option value="reversePolarity">{{ 'lab.toolbar.reversePolarityPreset' | t }}</option>
        <option value="fuseProtect">{{ 'lab.toolbar.fuseProtectPreset' | t }}</option>
        <option value="ripple">{{ 'lab.toolbar.ripplePreset' | t }}</option>
        <option value="buck">{{ 'lab.toolbar.buckPreset' | t }}</option>
        <option value="boost">{{ 'lab.toolbar.boostPreset' | t }}</option>
        <option value="rcLowPass">{{ 'lab.toolbar.rcLowPassPreset' | t }}</option>
        <option value="rcHighPass">{{ 'lab.toolbar.rcHighPassPreset' | t }}</option>
        <option value="rlcSeries">{{ 'lab.toolbar.rlcSeriesPreset' | t }}</option>
        <option value="bandPass">{{ 'lab.toolbar.bandPassPreset' | t }}</option>
        <option value="notchFilter">{{ 'lab.toolbar.notchFilterPreset' | t }}</option>
        <option value="voltageDivider">{{ 'lab.toolbar.voltageDividerPreset' | t }}</option>
        <option value="measureAc">{{ 'lab.toolbar.measureAcPreset' | t }}</option>
        <option value="motorPwm">{{ 'lab.toolbar.motorPwmPreset' | t }}</option>
        <option value="hBridge">{{ 'lab.toolbar.hBridgePreset' | t }}</option>
        <option value="motorDirection">{{ 'lab.toolbar.motorDirectionPreset' | t }}</option>
        <option value="pullUpDown">{{ 'lab.toolbar.pullUpDownPreset' | t }}</option>
        <option value="debounce">{{ 'lab.toolbar.debouncePreset' | t }}</option>
        <option value="ntcDivider">{{ 'lab.toolbar.ntcDividerPreset' | t }}</option>
        <option value="pwmFilter">{{ 'lab.toolbar.pwmFilterPreset' | t }}</option>
        <option value="relayBjt">{{ 'lab.toolbar.relayBjtPreset' | t }}</option>
        <option value="estopRelay">{{ 'lab.toolbar.estopRelayPreset' | t }}</option>
        <option value="industrial24v">{{ 'lab.toolbar.industrial24vPreset' | t }}</option>
      </select>
    </label>
    <button type="button" (click)="exportJson.emit()">{{ 'lab.toolbar.export' | t }}</button>
    <label class="file-btn">
      {{ 'lab.toolbar.import' | t }}
      <input type="file" accept="application/json,.json" (change)="onImportFile($event)" />
    </label>
    <button type="button" (click)="newSchematic.emit()">{{ 'lab.toolbar.new' | t }}</button>
    }
    <button type="button" class="primary run-btn" (click)="run.emit()" [disabled]="busy()">
      <span class="run-slot">
        <span [class.on]="!busy()">{{ 'lab.toolbar.run' | t }}</span>
        <span [class.on]="busy()">{{ 'lab.toolbar.running' | t }}</span>
      </span>
    </button>
  </div>
</div>
