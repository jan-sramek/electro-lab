<div class="toolbar">
  <div class="tool-group">
    <button type="button" [class.active]="tool() === 'select'" (click)="toolChange.emit('select')">
      {{ 'lab.toolbar.select' | t }}
    </button>
    <button type="button" [class.active]="tool() === 'wire'" (click)="toolChange.emit('wire')">
      {{ 'lab.toolbar.wire' | t }}
    </button>
    <button type="button" [class.active]="tool() === 'probe'" (click)="toolChange.emit('probe')">
      {{ 'lab.toolbar.probe' | t }}
    </button>
  </div>
  <div class="tool-group">
    <button
      type="button"
      [class.active]="analysisMode() === 'dcOp'"
      (click)="analysisModeChange.emit('dcOp')"
    >
      {{ 'lab.toolbar.dc' | t }}
    </button>
    <button
      type="button"
      [class.active]="analysisMode() === 'tran'"
      (click)="analysisModeChange.emit('tran')"
    >
      {{ 'lab.toolbar.transient' | t }}
    </button>
    @if (analysisMode() === 'tran') {
      <label class="timebase">
        {{ 'lab.toolbar.tStop' | t }}
        <input
          type="number"
          [ngModel]="tStop()"
          (ngModelChange)="tStopChange.emit($event)"
          step="0.001"
          min="0.0001"
        />
      </label>
      <label class="timebase">
        {{ 'lab.toolbar.dt' | t }}
        <input
          type="number"
          [ngModel]="dt()"
          (ngModelChange)="dtChange.emit($event)"
          step="0.00001"
          min="0.000001"
        />
      </label>
    }
  </div>
  <div class="tool-group tool-group-end">
    <button type="button" (click)="undo.emit()" [disabled]="!canUndo()">
      {{ 'lab.toolbar.undo' | t }}
    </button>
    <button type="button" (click)="redo.emit()" [disabled]="!canRedo()">
      {{ 'lab.toolbar.redo' | t }}
    </button>
    <button type="button" (click)="duplicate.emit()" [disabled]="!canDuplicate()">
      {{ 'lab.toolbar.duplicate' | t }}
    </button>
    <button type="button" class="danger" (click)="remove.emit()" [disabled]="!canDelete()">
      {{ 'lab.toolbar.delete' | t }}
    </button>
    <label class="preset-select">
      <span class="sr-only">{{ 'lab.toolbar.presets' | t }}</span>
      <select [ngModel]="selectedPreset() ?? ''" (ngModelChange)="onPresetModelChange($event)">
        <option value="" disabled>{{ 'lab.toolbar.presets' | t }}</option>
        <option value="led">{{ 'lab.toolbar.ledPreset' | t }}</option>
        <option value="rc">{{ 'lab.toolbar.rcPreset' | t }}</option>
        <option value="pot">{{ 'lab.toolbar.potPreset' | t }}</option>
        <option value="pulse">{{ 'lab.toolbar.pulsePreset' | t }}</option>
      </select>
    </label>
    <button type="button" (click)="exportJson.emit()">{{ 'lab.toolbar.export' | t }}</button>
    <label class="file-btn">
      {{ 'lab.toolbar.import' | t }}
      <input type="file" accept="application/json,.json" (change)="onImportFile($event)" />
    </label>
    <button type="button" (click)="newSchematic.emit()">{{ 'lab.toolbar.new' | t }}</button>
    <button type="button" class="primary run-btn" (click)="run.emit()" [disabled]="busy()">
      <span class="run-slot">
        <span [class.on]="!busy()">{{ 'lab.toolbar.run' | t }}</span>
        <span [class.on]="busy()">{{ 'lab.toolbar.running' | t }}</span>
      </span>
    </button>
  </div>
</div>
