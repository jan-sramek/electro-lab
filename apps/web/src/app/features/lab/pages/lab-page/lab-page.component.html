<section class="lab">
  <div class="lab-intro">
    <h1>{{ 'lab.title' | t }}</h1>
    <p>{{ 'lab.intro' | t }}</p>
  </div>

  <app-lab-toolbar
    [tool]="editor.tool()"
    [analysisMode]="editor.analysisMode()"
    [tStop]="editor.tStop()"
    [dt]="editor.dt()"
    [acFreq]="editor.acFreq()"
    [initFromDc]="editor.initFromDc()"
    [canUndo]="editor.canUndo()"
    [canRedo]="editor.canRedo()"
    [canDelete]="editor.selectedIds().length > 0 || editor.selectedWireIds().length > 0"
    [canDuplicate]="editor.selectedIds().length > 0"
    [busy]="sim.busy()"
    [selectedPreset]="editor.activeExamplePreset()"
    (toolChange)="editor.setTool($event)"
    (analysisModeChange)="editor.setAnalysisMode($event)"
    (tStopChange)="editor.setTStop($event)"
    (dtChange)="editor.setDt($event)"
    (acFreqChange)="editor.setAcFreq($event)"
    (initFromDcChange)="editor.setInitFromDc($event)"
    (undo)="editor.undo()"
    (redo)="editor.redo()"
    (duplicate)="editor.duplicateSelected()"
    (remove)="editor.deleteSelected()"
    (loadPreset)="onLoadPreset($event)"
    (exportJson)="editor.exportJson()"
    (importJson)="onImport($event)"
    (newSchematic)="editor.newSchematic()"
    (run)="sim.run()"
  />

  <div class="lab-layout">
    <aside class="side">
      <app-component-palette (place)="editor.onPalettePlace($event)" />
    </aside>

    <div class="center">
      <div class="canvas-wrap">
        <app-circuit-tabs
          [slots]="editor.slots()"
          [activeId]="editor.activeSlotId()"
          (activate)="editor.switchCircuitTab($event)"
          (add)="editor.addCircuitTab()"
          (close)="editor.closeCircuitTab($event)"
          (rename)="editor.renameCircuitTab($event.id, $event.name)"
        />
        <div class="status-rail">
          <app-status-banner
            [error]="sim.error()"
            [warnings]="sim.warnings()"
            [probe]="sim.probeSummary()"
            [info]="sim.capIcStatus()"
          />
        </div>
        <app-schematic-canvas
          [doc]="editor.doc()"
          [tool]="editor.tool()"
          [placeModel]="editor.placeModel()"
          [selectedId]="editor.selectedId()"
          [selectedIds]="editor.selectedIds()"
          [selectedWireIds]="editor.selectedWireIds()"
          [result]="sim.result()"
          [scrubIndex]="sim.scrubIndex()"
          [probeTarget]="editor.probeTarget()"
          [highlightedIds]="sim.highlightedIds()"
          [highlightedNets]="sim.highlightedNets()"
          (docChange)="editor.onDocChange($event)"
          (select)="editor.onSelect($event.id, $event.additive)"
          (selectMany)="editor.setSelection($event.ids, $event.additive)"
          (selectWire)="editor.onSelectWire($event.id, $event.additive)"
          (probe)="editor.onProbe($event)"
          (placeAt)="editor.onPlaceAt($event)"
          (dropPlace)="editor.placeModelAt($event.modelKey, $event.x, $event.y)"
        />
      </div>
      <p class="hint">{{ hintKey() | t }}</p>
    </div>

    <aside class="side">
      <app-inspector-panel
        [selected]="editor.selected()"
        [selectionCount]="editor.selectedIds().length"
        (paramChange)="editor.onParamChange($event)"
        (rotate)="editor.rotateSelected()"
        (remove)="editor.deleteSelected()"
        (replaceLed)="onReplaceLed()"
      />
      <app-results-panel [result]="sim.result()" />
      @if (editor.analysisMode() === 'tran') {
        <app-scope
          [tran]="sim.result()?.tran ?? null"
          [probeTarget]="editor.probeTarget()"
          [scrubIndex]="sim.scrubIndex()"
          (scrubIndexChange)="sim.setScrubIndex($event)"
        />
      }
    </aside>
  </div>
</section>
